name: Build Palimpsest
on:
  push:
    branches:
      - palimpsest-1.21.11
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and unit tests
        run: gradle build --stacktrace --console plain
      - name: Verify packaged assets
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'palimpsest-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" > jar-contents.txt
          TOOL_PNG="$(grep -cE '^assets/palimpsest/textures/item/.*\.png$' jar-contents.txt)"
          BLOCK_PNG="$(grep -cE '^assets/palimpsest/textures/block/.*\.png$' jar-contents.txt)"
          RECIPES="$(grep -cE '^data/palimpsest/recipe/.*\.json$' jar-contents.txt)"
          echo "In JAR: $TOOL_PNG item textures, $BLOCK_PNG block textures, $RECIPES recipes"
          test "$TOOL_PNG" -eq 33
          test "$BLOCK_PNG" -eq 28
          test "$RECIPES" -ge 61
          python3 -c "import pathlib,json; f=list(pathlib.Path('src/main/resources').rglob('*.json')); [json.loads(p.read_text()) for p in f]; print('Parsed JSON assets:',len(f))"
      - name: Smoke-test dedicated Minecraft server
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          echo "Starting Minecraft dedicated Fabric server..."
          timeout 125s gradle runServer --console plain --no-daemon > server-start.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 130); do
            if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' server-start.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "---- Last 100 lines of server log ----"
          tail -n 100 server-start.log || true
          if grep -Eq "Couldn't parse data file 'palimpsest|Failed to parse .*palimpsest|Failed to load.*palimpsest" server-start.log; then
            echo "::error::Malformed Palimpsest resources detected during server boot"
            exit 1
          fi
          if grep -Eq 'Encountered an unexpected exception|Crash Report' server-start.log; then
            echo "::error::Minecraft server crashed"
            exit 1
          fi
          if [ "$ready" -ne 1 ]; then
            echo "::error::Minecraft server did not reach ready state"
            exit 1
          fi
          echo "Dedicated Fabric server reached ready state."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Palimpsest-server-startup-log
          path: server-start.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Palimpsest-1.21.11-jar
          path: build/libs/palimpsest-*.jar
